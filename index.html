<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Stacja Pogodowa</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 20px;
        }
        #zegar { font-size: 80px; font-weight: bold; margin: 10px 0; }
        #data { font-size: 30px; margin-bottom: 30px; }
        img { filter: grayscale(100%) contrast(150%); }
    </style>
</head>
<body>

    <div id="zegar">00:00</div>
    <div id="data">Ładowanie daty...</div>

    <!-- POGODA (podmień 'Warszawa' na swoje miasto) -->
    <img src="https://wttr.in/Warszawa_0m_lang=pl.png" alt="Pogoda">

    <script>
        function aktualizuj() {
            var teraz = new Date();
            var h = String(teraz.getHours()).padStart(2, '0');
            var m = String(teraz.getMinutes()).padStart(2, '0');
            document.getElementById('zegar').innerText = h + ":" + m;
            
            var opcje = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('data').innerText = teraz.toLocaleDateString('pl-PL', opcje);
        }
        aktualizuj();
        setInterval(aktualizuj, 10000); // odświeżanie zegara
    </script>
</body>
</html>
